  # 这里可以用 HTML 标签（如 <br/>、<a>、<strong> 等）
  biography: |
    5 年后端与 DevOps 经验，做过统一身份认证、DevOps 告警平台、AIGC 图像生成和工业瑕疵检测，也做过 Kubernetes 分布式训练平台与具身机器人复现。
    目前在做企业 RAG 问答平台，负责后端架构、微服务、GitOps / CI/CD、MCP 工具集成与自动化交付；日常用 Go 和 Python，熟悉 Kubernetes、可观测性与云原生这套技术栈。
    <div class="my-2"></div>
    我相信工程师的价值在于把一件事从头到尾跑通：设计、开发、部署、观测。

