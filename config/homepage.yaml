# =====================================================
# Layout configuration for the Home (About Me) page
#
# - The order of sections below determines their display order on the page.
# - Set `enabled: false` to hide a section from the page.
# - `variant` controls the style/layout of the section (if applicable).
# =====================================================

homepage:
  sections:
    - name: Introduction
      variant: default
      enabled: true

    - name: Experience
      variant: default
      enabled: false # 教育/工作经历只放在可编辑的简历里，不在公开首页展示

    - name: Publications
      variant: default
      enabled: false # 模板示例论文，等真实内容

    - name: Projects
      variant: default
      enabled: false # 首页暂不展示（原为 GitHub 仓库自动同步），改用 /projects 页

    - name: Skills
      variant: default
      enabled: true

    - name: Talks
      variant: default # default | card
      enabled: false # 模板示例，等真实内容

    - name: Services
      variant: default # default | card
      enabled: false # 模板示例，等真实内容
